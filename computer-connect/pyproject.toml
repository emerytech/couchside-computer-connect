[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "couchside-computer-connect"
version = "0.1.0"
description = "Free local desktop viewer and remote input client for Couchside"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["websocket-client==1.9.2", "Pillow==13.0.0"]

[project.gui-scripts]
couchside-computer-connect = "computer_connect.ui:main"

[tool.setuptools.packages.find]
include = ["computer_connect*"]

[tool.setuptools.package-data]
computer_connect = ["assets/*"]
