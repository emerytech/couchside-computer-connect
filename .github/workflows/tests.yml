name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: "python -m pip install --require-hashes --only-binary=:all: -r computer-connect/requirements.lock"
      - run: python -m pip install cryptography==46.0.7
      - run: python tests/test_computer_connect.py -q
      - run: python tests/test_computer_connect_pin_widget.py -q
      - run: python tests/test_computer_connect_mouse_widget.py -q
      - run: python tests/test_win_input_only.py -q
      - run: python tests/test_win_https_upload.py -q
