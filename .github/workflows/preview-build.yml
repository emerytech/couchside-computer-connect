name: Prepare unsigned preview artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable client and collect dependency notices
        shell: powershell
        run: ./computer-connect/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-computer-connect-review
          path: computer-connect/dist/
          retention-days: 14
# Deliberately no release/publish/signing job, token or automatic trigger.
